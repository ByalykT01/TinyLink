services:
  tinylink:
    image: tinylink
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      retries: 3
      start_period: 10s
      timeout: 5s

  postgres:
    image: postgres:latest
    container_name: tinylink_dev 
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5555:5432"
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U backend -d tinylink_dev -h localhost -p 5432"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

networks:
  backend:
    driver: bridge

volumes:
  pgdata:

